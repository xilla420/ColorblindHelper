name: Build release binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ColorblindHelper-Windows.exe
          - os: macos-latest
            asset: ColorblindHelper-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build
        run: |
          python tools/make_icons.py
          python -m PyInstaller --noconfirm ColorblindHelper.spec
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item dist/ColorblindHelper.exe "dist/${{ matrix.asset }}"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/ColorblindHelper.app "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
